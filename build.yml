name: Build Mod
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Распаковка ресурсов
        run: |
          mkdir -p src/main/resources
          unzip -n -q resources_bundle.zip -d src/main/resources
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Сборка мода
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: AetheriumOverlord-Mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
